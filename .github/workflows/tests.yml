name: Package tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        illuminate: ['12.*', '13.*']
    defaults:
      run:
        working-directory: packages/event-integration
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Select Illuminate version
        run: >-
          composer require --no-update
          "illuminate/contracts:${{ matrix.illuminate }}"
          "illuminate/database:${{ matrix.illuminate }}"
          "illuminate/http:${{ matrix.illuminate }}"
          "illuminate/support:${{ matrix.illuminate }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run package tests
        run: composer test

      - name: Check PHP formatting
        run: composer format:check
